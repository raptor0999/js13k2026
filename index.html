<script>
let vertScrollSpeed = .1;

class Player extends EngineObject {
	numDigits = 0;

    constructor(pos)
    {
        super(pos, vec2(2), null, 0, RED);
        this.setCollision(); // make object collide
        this.renderOrder = 1; // render player on top
        this.numDigits = 0;
        this.damping = 0.7;
    }

    update()
    {
        // apply movement controls
        const moveInput = keyDirection().clampLength(1).scale(.2);
        this.velocity = this.velocity.add(moveInput);

        // smoothly follow player with lerp
        //cameraPos = cameraPos.lerp(this.pos, .1);
        var lastCameraPos = cameraPos;

        // only let the camera scroll up
        // no going back
        if (lastCameraPos.y <= this.pos.y) {
        	cameraPos.y = cameraPos.lerp(this.pos, .1).y;
        }
        

        if (mouseWasPressed(0) && this.numDigits > 0) {
        	// shoot bullet
            new Bullet(this.pos, mousePos.subtract(this.pos).normalize());
        }
    }
}

class Bullet extends EngineObject {
	shootSound = new Sound([.7,,120,.02,.07,.06,,3.5,17,-9,,,,,,,,.59,.08,,99]); // Shoot 9
	speed = 0;

    constructor(pos, velocity)
    {
        super(pos, vec2(.2), 0, 0, WHITE);
        this.setCollision(); // make object collide
        this.renderOrder = 2;
        this.velocity = velocity;

        this.shootSound.play();
    }

    update()
    {
        
    }

    collideWithObject(object) {
    	if (object instanceof Player) {
    		return false;
    	}
    }
}

class PhysicsObject extends EngineObject
{
    constructor(pos, size)
    {
        super(pos, size); // set object position and size
        this.setCollision(); // make object collide
        this.mass = 0; // make object have static physics
    }

    update() {
    	
    }
}

class Box extends EngineObject
{
    constructor(pos, size, what, when, color)
    {
        super(pos, size, what, when, color); // set object position and size
        this.setCollision(); // make object collide
        this.mass = 0; // make object have static physics
    }

    update() {
    	
    }
}

class Digit extends EngineObject {
	pickupSound = new Sound([1.5,,435,.03,.02,.22,1,4,,,323,.08,,,,,.03,.69,.03,,-1473]); // Pickup 2

    constructor(pos)
    {
        super(pos, vec2(1), null, 0, BLUE);
        this.setCollision(); // make object collide
        this.renderOrder = 2;
    }

    update()
    {
       
    }

    collideWithObject(object) {
    	if (object instanceof Player) {
    		this.pickupSound.play();
    		object.numDigits += 1;
    		this.destroy();
    	}	
    }
}

class Frog extends EngineObject {
	pickupSound = new Sound([2.5,.5,420,.02,.19,.27,1,1.3,3,-3,-100,.07,,.3,,,,.78,.21,,949]); // Powerup 12

    constructor(pos)
    {
        super(pos, vec2(1), null, 0, GREEN);
        this.setCollision(); // make object collide

    }

    update()
    {
        
    }

    collideWithObject(object) {
    	if (object instanceof Player) {
    		this.pickupSound.play();
    		this.destroy();
    	}	
    }
}

class Portal extends EngineObject {
	portalSound = new Sound([1.9,,594,.04,.5,.06,1,3.2,,2,,,,,,,,.74,.27,,663]); // Powerup 16

    constructor(pos)
    {
        super(pos, vec2(3), null, 0, WHITE);
        this.setCollision(); // make object collide
        this.renderOrder = 2;
    }

    update()
    {
        
    }

    collideWithObject(object) {
    	if (object instanceof Player) {
    		this.portalSound.play();

    		// reset game
        	engineObjectsDestroy();
        	gameInit();
    	}
    }
}

    // create collision objects

    {
        const size = vec2(rand(1,6),rand(1,6));

        const color = hsl(.1,.5,rand(.2));
        const o = new Box(pos, size, 0, 0, color);

    }

    for (let i=50; i--;) {
    	const pos = vec2(randInt(0+1, levelSize.x-1), randInt(50, 500));
    	new Digit(pos);
    }

    // create frawgs
    for (let i=50; i--;) {
    	const pos = vec2(randInt(0+1, levelSize.x-1), randInt(50, 500));
    	new Frog(pos);
    }

    // create portal to end level
    new Portal(vec2(19, 500));

    cameraPos.y = this.player.pos.y;
}
